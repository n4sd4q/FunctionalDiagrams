# Checks, without Mathematica, that the generated files are up to date and that the public functions are documented.
name: consistency
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 Development/check_consistency.py
